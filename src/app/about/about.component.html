
<div class="content" [ngClass]="loadingService.loading?loadingService.closeEndLoading?'fading-out':'fading-in':''">
    <div class="left-content">
        <div class="intro">
            <span *ngFor="let num of uti.getSplit('about.title' | translate)" class="popping title-about">{{num}}</span>
            <p class="description-myself">{{ 'about.description' | translate }}</p>

        </div>

    </div>

    <div class="right-content">
        <app-globus></app-globus>
    </div>
</div>
